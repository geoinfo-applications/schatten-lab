name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The data (site/data, about 7 MB) is committed, so the site is published as it is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

  deploy:
    needs: build
    # GitHub's free plan has no Pages for private repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
